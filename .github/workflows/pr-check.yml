name: PR Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.20', '1.21', '1.22', '1.23', '1.24', '1.25', '1.26']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod

      - name: Setup Go for tooling
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Restore matrix Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod

      - name: Check formatting
        run: make fmt_check

      - name: Run go vet
        run: make vet

      - name: Run staticcheck
        run: make staticcheck

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.20', '1.21', '1.22', '1.23', '1.24', '1.25', '1.26']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod

      - name: Verify build
        run: make build

      - name: Run race tests
        run: make test_race

      - name: Run tests with coverage
        run: make test_cov

      - name: Enforce 100% coverage
        run: |
          coverage="$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')"
          echo "Total coverage: ${coverage}"
          test "${coverage}" = "100.0%"

      - name: Generate coverage HTML
        run: make coverage_html

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-html
          path: coverage.html
          if-no-files-found: ignore

  security:
    name: Security (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.20', '1.21', '1.22', '1.23', '1.24', '1.25', '1.26']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod

      - name: Setup Go for tooling
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Install security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Restore matrix Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod

      - name: Run security checks
        run: make security
